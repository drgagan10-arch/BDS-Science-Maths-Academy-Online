<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDS Academy | Live Classes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f4f8; }
        nav { background: #1e3a8a; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .nav-links a { color: white; text-decoration: none; margin: 0 1rem; padding: 0.5rem; }
        .nav-links a:hover { background: #3b5e9c; border-radius: 8px; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 24px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        .class-card { background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: 1rem; }
        .class-category { background: #e0e7ff; padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; display: inline-block; margin-bottom: 8px; }
        button { background: #1e3a8a; color: white; border: none; padding: 8px 16px; border-radius: 40px; cursor: pointer; margin-top: 10px; }
        select { padding: 8px; border-radius: 20px; border: 1px solid #cbd5e1; margin: 10px 0; width: 100%; max-width: 300px; }
        footer { text-align: center; padding: 2rem; background: #1e293b; color: #94a3b8; margin-top: 2rem; }
        .auth-buttons { display: flex; gap: 12px; align-items: center; }
        .user-email { font-size: 0.9rem; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 30px; }
        @media (max-width: 768px) { .nav-links a { display: inline-block; margin: 0.5rem; } }
    </style>
</head>
<body>
    <nav>
        <div class="logo">📚 BDS Academy</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="membership.html">Membership</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="live-classes.html">Live Classes</a>
            <a href="admin.html">Admin</a>
        </div>
        <div class="auth-buttons" id="authButtons"></div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>🎥 Live Classes (Based on your membership plan)</h2>
            <label>Filter by Category:</label>
            <select id="categoryFilter">
                <option value="all">All (within your plan)</option>
            </select>
            <div id="classesList">Loading classes...</div>
        </div>
    </div>

    <footer>© 2025 Baba Deep Singh Science & Maths Academy</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEDiAXK2lrXQI_RQMSMC7MlueyNBjKUAQ",
            authDomain: "bds-onlinr-coaching.firebaseapp.com",
            projectId: "bds-onlinr-coaching",
            storageBucket: "bds-onlinr-coaching.firebasestorage.app",
            messagingSenderId: "904398440973",
            appId: "1:904398440973:web:cc42490d681d305641e344"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userPlan = null;
        let allowedCategories = [];

        // Full category mapping for each plan
        const planCategories = {
            'class5_10': [
                'class5_science', 'class5_maths',
                'class6_science', 'class6_maths',
                'class7_science', 'class7_maths',
                'class8_science', 'class8_maths',
                'class9_science', 'class9_maths',
                'class10_science', 'class10_maths'
            ],
            'class11_12': [
                'class11_physics', 'class11_chemistry', 'class11_biology',
                'class12_physics', 'class12_chemistry', 'class12_biology'
            ],
            'neet': ['neet']
        };

        // Human-readable names for categories
        const categoryNames = {
            'class5_science': 'Class 5 Science', 'class5_maths': 'Class 5 Maths',
            'class6_science': 'Class 6 Science', 'class6_maths': 'Class 6 Maths',
            'class7_science': 'Class 7 Science', 'class7_maths': 'Class 7 Maths',
            'class8_science': 'Class 8 Science', 'class8_maths': 'Class 8 Maths',
            'class9_science': 'Class 9 Science', 'class9_maths': 'Class 9 Maths',
            'class10_science': 'Class 10 Science', 'class10_maths': 'Class 10 Maths',
            'class11_physics': 'Class 11 Physics', 'class11_chemistry': 'Class 11 Chemistry', 'class11_biology': 'Class 11 Biology',
            'class12_physics': 'Class 12 Physics', 'class12_chemistry': 'Class 12 Chemistry', 'class12_biology': 'Class 12 Biology',
            'neet': 'NEET Preparation'
        };

        const authDiv = document.getElementById('authButtons');
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                authDiv.innerHTML = `<span class="user-email">${user.email}</span> <button id="logoutNavBtn">Logout</button>`;
                document.getElementById('logoutNavBtn').addEventListener('click', () => signOut(auth));
                
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    const status = data.membershipStatus;
                    userPlan = data.selectedPlan;
                    if (status !== 'approved' || !userPlan || !planCategories[userPlan]) {
                        document.getElementById('classesList').innerHTML = '<p style="color:#e11d48;">❌ Membership required or plan not approved. Please purchase membership and get approval.</p>';
                        return;
                    }
                    allowedCategories = planCategories[userPlan];
                    populateCategoryFilter();
                    loadAllClasses();
                } else {
                    document.getElementById('classesList').innerHTML = '<p style="color:#e11d48;">❌ User data not found. Please contact admin.</p>';
                }
            } else {
                authDiv.innerHTML = `<button id="loginNavBtn">Login / Sign up</button>`;
                document.getElementById('loginNavBtn').addEventListener('click', () => {
                    window.location.href = 'membership.html';
                });
                document.getElementById('classesList').innerHTML = '<p>Please login to view live classes.</p>';
            }
        });

        function populateCategoryFilter() {
            const filterSelect = document.getElementById('categoryFilter');
            filterSelect.innerHTML = '<option value="all">All (within your plan)</option>';
            allowedCategories.forEach(cat => {
                const displayName = categoryNames[cat] || cat.replace('_', ' ').toUpperCase();
                filterSelect.innerHTML += `<option value="${cat}">${displayName}</option>`;
            });
        }

        async function loadAllClasses(filter = 'all') {
            const q = query(collection(db, "classes"), orderBy("dateTime", "asc"));
            const snapshot = await getDocs(q);
            let classes = [];
            snapshot.forEach(doc => classes.push({ id: doc.id, ...doc.data() }));
            
            // Filter by allowed categories and optional category filter
            classes = classes.filter(c => allowedCategories.includes(c.category));
            if (filter !== 'all') {
                classes = classes.filter(c => c.category === filter);
            }
            
            const container = document.getElementById('classesList');
            if (classes.length === 0) {
                container.innerHTML = '<p>No live classes available for your plan.</p>';
                return;
            }
            let html = `<div class="class-grid">`;
            classes.forEach(cls => {
                const catDisplay = categoryNames[cls.category] || cls.category.replace('_',' ').toUpperCase();
                html += `
                    <div class="class-card">
                        <span class="class-category">${catDisplay}</span>
                        <h3>${cls.title}</h3>
                        <p><i class="fas fa-calendar"></i> ${new Date(cls.dateTime).toLocaleString()}</p>
                        <button class="joinBtn" data-link="${cls.zoomLink}" data-pwd="${cls.zoomPassword || ''}">Join Live Class</button>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
            document.querySelectorAll('.joinBtn').forEach(btn => {
                btn.addEventListener('click', () => {
                    let link = btn.dataset.link;
                    const pwd = btn.dataset.pwd;
                    if (pwd) alert(`Zoom password: ${pwd}`);
                    window.open(link, '_blank');
                });
            });
        }

        document.getElementById('categoryFilter').addEventListener('change', (e) => {
            if (currentUser && userPlan) loadAllClasses(e.target.value);
        });
    </script>
</body>
</html>
